<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors-ligne — Smart Parking 2035</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-body">

  <div class="auth-wrapper" style="max-width: 460px;">
    <div class="auth-card" style="text-align: center;">

      <div class="auth-brand" style="justify-content: center;">
        <div class="auth-brand-icon">SP</div>
        <div>
          <div class="auth-brand-name">Smart Parking</div>
          <div class="auth-brand-year">2035</div>
        </div>
      </div>

      <div class="auth-title" style="margin-top: 16px;">Vous etes hors-ligne</div>
      <div class="auth-subtitle">
        Pas de connexion internet pour le moment.<br>
        La recherche de parking a besoin du reseau.<br>
        Verifiez votre connexion puis reessayez.
      </div>

      <button class="btn btn-primary"
              style="width: 100%; justify-content: center; margin-top: 20px;"
              onclick="window.location.reload()">
        Reessayer
      </button>

    </div>
  </div>

</body>
</html>
