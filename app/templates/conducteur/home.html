<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Rendu "app plein ecran" sur iOS (pas de barre de navigateur). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Espace conducteur — Smart Parking 2035</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Design "app moderne" reserve aux pages mobiles. -->
  <link rel="stylesheet" href="/static/css/mobile.css" />
  <!-- Feuille de style de la carte Leaflet (chargee depuis internet). -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- PWA : le manifeste (nom, icones, couleurs) rend l'app installable. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2c5be0" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
</head>
<body class="m-screen">

  <!-- ===================== CONTENU ===================== -->
  <main class="m-content">

    <div class="m-intro">
      <div class="m-intro-title">Bonjour {{ request.session.get("user_nom", "") }}</div>
      <div class="m-intro-sub">Trouvez le parking le plus proche de vous.</div>
    </div>

    <!-- Carte d'action : trouver un parking -->
    <div class="m-card">
      <!-- Le gros bouton : quand on clique, on demande la position GPS. -->
      <button id="bouton-chercher" class="m-btn m-btn-primary">
        Trouver un parking pres de moi
      </button>

      <div class="m-or">— ou —</div>

      <!-- Mode "position de test" : pour aller vite, sans attendre le GPS. -->
      <label class="m-label" for="liste-carrefours">Choisir une position de test :</label>
      <select id="liste-carrefours" class="m-field">
        <option value="-18.91,47.521">Analakely</option>
        <option value="-18.905,47.5215">Soarano</option>
        <option value="-18.912,47.526">Antaninarenina</option>
        <option value="-18.916,47.524">Ambohijatovo</option>
        <option value="-18.92,47.521">Anosy</option>
        <option value="-18.917,47.527">Mahamasina</option>
        <option value="-18.911,47.518">Isoraka</option>
        <option value="-18.907,47.518">Tsaralalana</option>
        <option value="-18.903,47.527">Behoririka</option>
        <option value="-18.9,47.532">Andravoahangy</option>
        <option value="-18.88,47.523">Ankorondrano</option>
        <option value="-18.918,47.53">Andohalo</option>
      </select>
      <button id="bouton-test" class="m-btn m-btn-secondary">
        Chercher depuis cette position
      </button>
    </div>

    <!-- Petite zone de message (chargement, erreurs...). -->
    <div id="message" class="m-message"></div>

    <!-- La liste des parkings recommandes s'affichera ici. -->
    <div id="resultats"></div>

  </main>

  <!-- ===================== VUE CARTE PLEIN ECRAN ===================== -->
  <!-- S'ouvre quand on clique "Voir le trajet". La carte remplit l'ecran
       et la fiche du trajet "remonte" du bas. -->
  <div class="m-mapview" id="vue-carte">
    <div id="carte" class="m-fullmap"></div>
    <button class="m-map-close" id="fermer-carte" title="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="m-sheet" id="fiche-trajet">
      <div class="m-sheet-handle"></div>
      <div id="fiche-contenu"></div>
    </div>
  </div>

  <!-- ===================== BARRE D'ONGLETS (bas) ===================== -->
  <nav class="m-tabbar">
    <a href="/conducteur/" class="m-tab actif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/>
      </svg>
      Accueil
    </a>
    <a href="/auth/profil" class="m-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Profil
    </a>
    <a href="/auth/logout" class="m-tab deconnexion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Quitter
    </a>
  </nav>

  <!-- PWA : on active le service worker (cache + hors-ligne). -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }

  </script>

  <!-- Librairie de carte Leaflet (chargee depuis internet). -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ============================================================= -->
  <!--  Le JavaScript : ce qui se passe quand on clique le bouton.   -->
  <!-- ============================================================= -->
  <script>
    // On retrouve les morceaux de la page dont on a besoin.
    var bouton = document.getElementById("bouton-chercher");
    var boutonTest = document.getElementById("bouton-test");
    var listeCarrefours = document.getElementById("liste-carrefours");
    var message = document.getElementById("message");
    var resultats = document.getElementById("resultats");
    var divCarte = document.getElementById("carte");

    // La vue carte plein ecran + sa fiche du bas + le bouton fermer.
    var vueCarte = document.getElementById("vue-carte");
    var ficheContenu = document.getElementById("fiche-contenu");
    var fermerCarte = document.getElementById("fermer-carte");
    // Le bouton "fermer" referme la vue carte plein ecran.
    fermerCarte.addEventListener("click", function () {
      vueCarte.classList.remove("actif");
    });

    // On garde en memoire la derniere recherche (la liste des parkings)
    // et la position du conducteur, pour pouvoir dessiner un trajet quand
    // on clique sur "Voir le trajet".
    var derniersParkings = [];
    var positionConducteur = null;

    // L'objet "carte" Leaflet. On le cree une seule fois, a la demande.
    var carte = null;
    // On garde la ligne et les marqueurs deja dessines pour pouvoir les
    // effacer avant de dessiner un nouveau trajet.
    var dessinsCarte = [];
    // Les traits gris du reseau complet (dessines une seule fois).
    var dessinsReseau = [];

    // Le reseau complet (tous les carrefours + toutes les routes) et le
    // nombre total de carrefours. On le charge une fois au demarrage pour
    // pouvoir dessiner le graphe en gris sous le trajet choisi.
    var reseau = null;
    var nombreNoeudsTotal = 52;

    fetch("/api/graphe/carte")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        reseau = d;
        nombreNoeudsTotal = d.nombre_noeuds;
      })
      .catch(function () { /* pas grave : la carte marchera sans le gris */ });

    // --- Bouton "position de test" : instantane, sans GPS ---
    boutonTest.addEventListener("click", function () {
      // La valeur choisie ressemble a "-18.905,47.5215".
      // On la coupe au niveau de la virgule pour separer lat et lon.
      var morceaux = listeCarrefours.value.split(",");
      var lat = morceaux[0];
      var lon = morceaux[1];

      // On reutilise exactement le meme code que pour le GPS.
      chercherParkings(lat, lon);
    });

    // Quand on clique sur le bouton...
    bouton.addEventListener("click", function () {

      // 1) On verifie que le navigateur sait donner la position GPS.
      if (!navigator.geolocation) {
        message.textContent = "Votre navigateur ne sait pas donner votre position.";
        return;
      }

      // 2) On previent l'utilisateur et on vide les anciens resultats.
      message.textContent = "Recherche de votre position... (cela peut prendre quelques secondes)";
      resultats.innerHTML = "";

      // 3) Quelques reglages pour que la localisation soit plus rapide.
      var options = {
        // On ne demande PAS la precision GPS maximale : c'est plus rapide,
        // et inutile ici (on cherche juste le carrefour le plus proche).
        enableHighAccuracy: false,
        // On arrete d'attendre apres 10 secondes (10000 millisecondes).
        timeout: 10000,
        // On autorise une position deja connue de moins d'1 minute
        // (60000 ms) : si on recherche a nouveau, c'est quasi instantane.
        maximumAge: 60000
      };

      // 4) On demande la position. Le navigateur affiche un popup
      //    "Autoriser la localisation ?". Ensuite il appelle soit
      //    la fonction de succes, soit la fonction d'erreur.
      navigator.geolocation.getCurrentPosition(succes, erreur, options);
    });

    // --- Si on a reussi a avoir la position GPS ---
    function succes(position) {
      var lat = position.coords.latitude;
      var lon = position.coords.longitude;
      chercherParkings(lat, lon);
    }

    // --- Appeler l'endpoint et afficher les parkings ---
    //  (utilise aussi bien par le GPS que par la position de test)
    function chercherParkings(lat, lon) {
      message.textContent = "Recherche des parkings...";

      // On retient la position de depart (utile pour dessiner le trajet).
      positionConducteur = [parseFloat(lat), parseFloat(lon)];

      // On appelle notre endpoint avec la position donnee.
      var url = "/api/recommandation?lat=" + lat + "&lon=" + lon;

      fetch(url)
        .then(function (reponse) { return reponse.json(); })
        .then(function (donnees) { afficher(donnees); })
        .catch(function () {
          message.textContent = "Une erreur est survenue. Reessayez.";
        });
    }

    // --- Si on n'a PAS pu avoir la position ---
    //  Le navigateur nous donne un "code" qui dit pourquoi ca a echoue.
    function erreur(probleme) {
      if (probleme.code === 1) {
        message.textContent = "Vous avez refuse la localisation. Autorisez-la puis reessayez.";
      } else if (probleme.code === 3) {
        message.textContent = "La localisation a pris trop de temps. Reessayez.";
      } else {
        message.textContent = "Impossible d'obtenir votre position. Reessayez.";
      }
    }

    // --- Afficher la liste des parkings recommandes ---
    function afficher(donnees) {
      var liste = donnees.parkings;

      // Aucun parking dispo ?
      if (!liste || liste.length === 0) {
        message.textContent = "Aucun parking disponible pour le moment.";
        return;
      }

      // On garde la liste en memoire pour le bouton "Voir le trajet".
      derniersParkings = liste;

      // On retient le nombre total de carrefours (pour "X sur 52").
      if (donnees.nombre_noeuds_total) {
        nombreNoeudsTotal = donnees.nombre_noeuds_total;
      }

      message.textContent = liste.length + " parking(s) trouve(s) :";

      // On construit une jolie carte pour chaque parking.
      var html = "";
      for (var i = 0; i < liste.length; i++) {
        var p = liste[i];

        // L'itineraire en toutes lettres : "Anosy -> Isoraka -> ... -> 67ha".
        var itineraire = p.chemin.join(" → ");

        // Le 1er parking de la liste = le plus proche = le recommande.
        // Il recoit un badge vert et un lisere bleu (classe "m-result--top").
        var badge = "";
        var classeTop = "";
        if (i === 0) {
          badge = '<span class="m-badge">Recommande</span>';
          classeTop = " m-result--top";
        }

        html = html +
          '<div class="m-result' + classeTop + '">' +
            // Ligne du haut : nom du parking + badge eventuel.
            '<div class="m-result-head">' +
              '<div class="m-result-name">' + (i + 1) + '. ' + p.nom + '</div>' +
              badge +
            '</div>' +
            // Les "stats" en pilules : distance + places libres.
            '<div class="m-chips">' +
              '<span class="m-chip">' + p.distance + ' m</span>' +
              '<span class="m-chip">' + p.places_disponibles + ' places libres</span>' +
            '</div>' +
            // L'itineraire choisi par A* (la suite de carrefours).
            '<div class="m-route"><b>Itineraire :</b> ' + itineraire + '</div>' +
            // La preuve d'optimisation : A* explore peu de carrefours.
            '<div class="m-explore">A* a explore ' + p.nombre_explores +
              ' carrefours sur ' + nombreNoeudsTotal + '</div>' +
            // Bouton "Voir le trajet" : dessine l'itineraire sur la carte.
            '<button class="m-btn m-btn-secondary" ' +
              'onclick="afficherTrajet(' + i + ')">Voir le trajet</button>' +
            // Bouton "Reserver" : il appelle reserver(...) avec l'id du parking.
            '<button class="m-btn m-btn-primary" ' +
              'onclick="reserver(' + p.id + ')">Reserver une place</button>' +
          '</div>';
      }
      resultats.innerHTML = html;
    }

    // --- Dessiner TOUT le reseau en gris (carrefours + routes) ---
    //  Appelee une seule fois, a la creation de la carte. Le gris reste
    //  sous le trajet bleu (qu'on redessine a chaque "Voir le trajet").
    function dessinerReseauGris() {
      if (reseau === null) {
        return;   // le reseau n'est pas (encore) charge : tant pis.
      }

      // 1) Toutes les routes, en traits ORANGE (bien visibles).
      for (var a = 0; a < reseau.aretes.length; a++) {
        var trait = L.polyline(reseau.aretes[a], {
          color: "#ff8c00", weight: 2, opacity: 0.8
        }).addTo(carte);
        dessinsReseau.push(trait);
      }

      // 2) Tous les carrefours, en petits points orange avec leur nom.
      for (var n = 0; n < reseau.noeuds.length; n++) {
        var noeud = reseau.noeuds[n];
        var point = L.circleMarker([noeud.latitude, noeud.longitude], {
          radius: 3, color: "#cc6600", fillColor: "#ffae42", fillOpacity: 1
        }).addTo(carte);
        point.bindPopup(noeud.nom);
        dessinsReseau.push(point);
      }
    }

    // --- Dessiner le trajet d'un parking sur la carte Leaflet ---
    //  indice = la position du parking dans la liste derniersParkings.
    function afficherTrajet(indice) {
      var parking = derniersParkings[indice];
      var points = parking.chemin_coords;   // liste de [lat, lon]

      // Si on n'a pas de points a tracer, on previent et on s'arrete.
      if (!points || points.length === 0) {
        message.textContent = "Trajet indisponible pour ce parking.";
        return;
      }

      // On remplit la fiche du bas avec les infos du trajet.
      var itineraire = parking.chemin.join(" → ");
      ficheContenu.innerHTML =
        '<div class="m-result-name" style="margin-bottom:10px;">' + parking.nom + '</div>' +
        '<div class="m-chips">' +
          '<span class="m-chip">' + parking.distance + ' m</span>' +
          '<span class="m-chip">' + parking.places_disponibles + ' places libres</span>' +
        '</div>' +
        '<div class="m-route"><b>Itineraire :</b> ' + itineraire + '</div>' +
        '<button class="m-btn m-btn-primary" ' +
          'onclick="reserver(' + parking.id + ')">Reserver une place</button>';

      // On ouvre la vue carte plein ecran (elle etait cachee).
      vueCarte.classList.add("actif");

      // 1) On cree la carte la 1ere fois seulement.
      if (carte === null) {
        carte = L.map("carte");
        // Le fond de carte (les rues) vient d'OpenStreetMap.
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap"
        }).addTo(carte);

        // On dessine TOUT le reseau en gris (une seule fois), pour que
        // le prof voie toutes les routes possibles et comprenne pourquoi
        // A* a choisi tel chemin plutot qu'un autre.
        dessinerReseauGris();
      }

      // 2) On efface les dessins precedents (ancienne ligne et marqueurs).
      for (var i = 0; i < dessinsCarte.length; i++) {
        carte.removeLayer(dessinsCarte[i]);
      }
      dessinsCarte = [];

      // 3) On trace la ligne du trajet (la "polyline") en bleu.
      var ligne = L.polyline(points, { color: "blue", weight: 5 }).addTo(carte);
      dessinsCarte.push(ligne);

      // 3bis) On pose un petit point sur CHAQUE carrefour traverse, avec
      //       son nom en popup. Ca montre clairement que la ligne passe
      //       par une suite de carrefours (et non "au hasard").
      //       parking.chemin contient les noms, dans le meme ordre que
      //       les points (chemin_coords) : on les parcourt ensemble.
      var noms = parking.chemin;
      for (var c = 0; c < points.length; c++) {
        var pastille = L.circleMarker(points[c], {
          radius: 5,
          color: "blue",
          fillColor: "white",
          fillOpacity: 1
        }).addTo(carte);
        // Si on a le nom de ce carrefour, on l'affiche au clic.
        if (noms && noms[c]) {
          pastille.bindPopup((c + 1) + ". " + noms[c]);
        }
        dessinsCarte.push(pastille);
      }

      // 4) Le marqueur du PARKING d'arrivee (sa vraie position).
      var pointParking = [parking.latitude, parking.longitude];
      var arrivee = L.marker(pointParking).addTo(carte);
      arrivee.bindPopup(parking.nom);
      dessinsCarte.push(arrivee);

      // 4bis) Le "dernier bout" : du dernier carrefour JUSQU'AU parking.
      //       A* relie carrefour -> carrefour ; il reste un acces final
      //       entre le carrefour le plus proche et le parking reel.
      //       On le trace en POINTILLES bleus pour que la ligne arrive
      //       bien jusqu'au repere du parking.
      var dernierCarrefour = points[points.length - 1];
      var accesParking = L.polyline([dernierCarrefour, pointParking], {
        color: "blue", weight: 3, dashArray: "6, 8"
      }).addTo(carte);
      dessinsCarte.push(accesParking);

      // 5) Un marqueur au depart (position du conducteur) + le "1er bout"
      //    en pointilles : de la position jusqu'au 1er carrefour du trajet.
      if (positionConducteur !== null) {
        var depart = L.marker(positionConducteur).addTo(carte);
        depart.bindPopup("Vous etes ici");
        dessinsCarte.push(depart);

        var accesDepart = L.polyline([positionConducteur, points[0]], {
          color: "blue", weight: 3, dashArray: "6, 8"
        }).addTo(carte);
        dessinsCarte.push(accesDepart);
      }

      // 6) On cadre la carte pour que TOUT soit visible (depart, trajet,
      //    parking et les deux bouts en pointilles).
      var tousLesPoints = points.concat([pointParking]);
      if (positionConducteur !== null) {
        tousLesPoints = tousLesPoints.concat([positionConducteur]);
      }

      // La carte vient d'apparaitre (elle etait cachee) : on dit a Leaflet
      // que sa taille a change, PUIS on cadre. On laisse aussi de la place
      // en bas (la fiche couvre le bas de l'ecran).
      setTimeout(function () {
        carte.invalidateSize();
        carte.fitBounds(L.latLngBounds(tousLesPoints), {
          paddingTopLeft: [30, 70],
          paddingBottomRight: [30, 260]
        });
      }, 250);
    }

    // --- Reserver une place dans un parking ---
    function reserver(parkingId) {
      message.textContent = "Reservation en cours...";

      // On cree la reservation cote serveur (methode POST).
      fetch("/api/reservations?parking_id=" + parkingId, { method: "POST" })
        .then(function (reponse) {
          if (!reponse.ok) { throw new Error("echec"); }
          return reponse.json();
        })
        .then(function (donnees) {
          // On va sur la page qui affiche le QR code de la reservation.
          window.location.href = "/reservations/" + donnees.reservation_id;
        })
        .catch(function () {
          message.textContent = "Reservation impossible (parking complet ?). Reessayez.";
        });
    }
  </script>

</body>
</html>
