<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Rendu "app plein ecran" sur iOS (pas de barre de navigateur). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Espace gardien — Smart Parking 2035</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Design "app moderne" reserve aux pages mobiles. -->
  <link rel="stylesheet" href="/static/css/mobile.css" />
  <!-- PWA : le manifeste (nom, icones, couleurs) rend l'app installable. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2c5be0" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
</head>
<body class="m-screen">

  <!-- ===================== ECRAN DE DEMARRAGE (splash) ===================== -->
  <div class="m-splash" id="splash">
    <div class="m-splash-logo">SP</div>
  </div>
  <script>
    // On montre le logo SP UNE fois par ouverture de l'app.
    (function () {
      var splash = document.getElementById("splash");
      if (sessionStorage.getItem("splash_vu")) {
        splash.style.display = "none";
        return;
      }
      sessionStorage.setItem("splash_vu", "1");
      setTimeout(function () { splash.classList.add("cache"); }, 1100);
      setTimeout(function () { splash.style.display = "none"; }, 1600);
    })();
  </script>

  <!-- ===================== CONTENU ===================== -->
  <main class="m-content">

    <div class="m-intro">
      <div class="m-intro-title">Bonjour {{ request.session.get("user_nom", "") }}</div>
      <div class="m-intro-sub">
        Scannez ou tapez le code, puis validez l'entree ou la sortie.
      </div>
    </div>

    <div class="m-card">
      <!-- Zone camera (le scan dessine ici). Cachee tant qu'on ne scanne pas. -->
      <div id="zone-camera" class="m-camera" style="display: none;"></div>

      <button id="bouton-scanner" class="m-btn m-btn-secondary">
        Scanner avec la camera
      </button>

      <div class="m-or">— ou —</div>

      <!-- Saisie manuelle du code (marche toujours, meme sans camera). -->
      <label class="m-label" for="champ-code">Code de la reservation :</label>
      <input id="champ-code" type="text" placeholder="RES-XXXXXX"
             class="m-field" style="text-transform: uppercase;" />

      <!-- Les deux boutons d'action, cote a cote -->
      <div class="m-row">
        <button id="bouton-entree" class="m-btn m-btn-primary">Entree</button>
        <button id="bouton-sortie" class="m-btn m-btn-primary">Sortie</button>
      </div>
    </div>

    <!-- Zone de resultat (message + montant a payer) -->
    <div id="resultat" style="margin-bottom: 12px;"></div>

  </main>

  <!-- ===================== BARRE D'ONGLETS (bas) ===================== -->
  <nav class="m-tabbar">
    <a href="/gardien/" class="m-tab actif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/>
      </svg>
      Accueil
    </a>
    <a href="/auth/profil" class="m-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Profil
    </a>
    <a href="/auth/logout" class="m-tab deconnexion"
       onclick="return confirm('Voulez-vous vraiment vous déconnecter ?')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Quitter
    </a>
  </nav>

  <!-- PWA : on active le service worker (cache + hors-ligne). -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }

  </script>

  <!-- Librairie de scan QR par la camera (chargee depuis internet). -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <script>
    var champCode = document.getElementById("champ-code");
    var resultat = document.getElementById("resultat");
    var boutonEntree = document.getElementById("bouton-entree");
    var boutonSortie = document.getElementById("bouton-sortie");
    var boutonScanner = document.getElementById("bouton-scanner");
    var zoneCamera = document.getElementById("zone-camera");

    // --- Envoyer le code au serveur (entree ou sortie) ---
    function envoyer(action) {
      var code = champCode.value.trim().toUpperCase();
      if (code === "") {
        resultat.innerHTML = "<div class='m-alert m-alert-error'>Entrez un code d'abord.</div>";
        return;
      }

      resultat.textContent = "Verification...";
      var url = "/api/gardien/" + action + "?code=" + encodeURIComponent(code);

      fetch(url, { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) {
            resultat.innerHTML = "<div class='m-alert m-alert-error'>" + d.message + "</div>";
            return;
          }
          var texte = "<div class='m-alert m-alert-success'>" + d.message;
          if (action === "sortie") {
            // On affiche le montant a encaisser en especes.
            texte = texte + "<br><strong>Montant a payer : " + d.montant + " Ar</strong>";
          }
          texte = texte + "</div>";
          resultat.innerHTML = texte;
        })
        .catch(function () {
          resultat.innerHTML = "<div class='m-alert m-alert-error'>Erreur reseau. Reessayez.</div>";
        });
    }

    boutonEntree.addEventListener("click", function () { envoyer("entree"); });
    boutonSortie.addEventListener("click", function () { envoyer("sortie"); });

    // --- Scanner le QR avec la camera ---
    boutonScanner.addEventListener("click", function () {
      // Si la librairie n'a pas pu se charger (ex : hors-ligne), on previent.
      if (typeof Html5Qrcode === "undefined") {
        resultat.innerHTML = "<div class='m-alert m-alert-error'>" +
          "Scanner indisponible. Tapez le code a la main.</div>";
        return;
      }

      zoneCamera.style.display = "block";
      var scanner = new Html5Qrcode("zone-camera");

      scanner.start(
        { facingMode: "environment" },   // camera arriere du telephone
        { fps: 10, qrbox: 220 },
        function (codeLu) {
          // Quand un QR est lu : on remplit le champ et on arrete la camera.
          champCode.value = codeLu;
          scanner.stop().then(function () {
            zoneCamera.style.display = "none";
          });
          resultat.innerHTML = "<div class='m-alert m-alert-success'>Code lu : " + codeLu + "</div>";
        },
        function () { /* on ignore les images sans QR */ }
      ).catch(function () {
        resultat.innerHTML = "<div class='m-alert m-alert-error'>" +
          "Impossible d'ouvrir la camera. Tapez le code a la main.</div>";
      });
    });
  </script>

</body>
</html>
