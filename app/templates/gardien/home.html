<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace gardien — Smart Parking 2035</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- PWA : le manifeste (nom, icones, couleurs) rend l'app installable. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
</head>
<body class="auth-body">

  <div class="auth-wrapper" style="max-width: 520px;">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-brand-icon">SP</div>
        <div>
          <div class="auth-brand-name">Smart Parking</div>
          <div class="auth-brand-year">2035</div>
        </div>
      </div>

      <div class="auth-title">Bonjour {{ request.session.get("user_nom", "") }}</div>
      <div class="auth-subtitle">
        Scannez ou tapez le code du conducteur, puis validez l'entree ou la sortie.
      </div>

      <!-- Zone camera (le scan dessine ici). Cachee tant qu'on ne scanne pas. -->
      <div id="zone-camera" style="margin: 16px 0; display: none;"></div>

      <button id="bouton-scanner" class="btn btn-secondary"
              style="width: 100%; justify-content: center; margin-bottom: 12px;">
        Scanner avec la camera
      </button>

      <!-- Saisie manuelle du code (marche toujours, meme sans camera). -->
      <label for="champ-code" style="display:block; margin-bottom:6px; font-size:14px;">
        Code de la reservation :
      </label>
      <input id="champ-code" type="text" placeholder="RES-XXXXXX"
             style="width:100%; padding:10px; margin-bottom:12px; text-transform:uppercase;" />

      <!-- Les deux boutons d'action -->
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <button id="bouton-entree" class="btn btn-primary" style="flex:1; justify-content:center;">
          Valider l'entree
        </button>
        <button id="bouton-sortie" class="btn btn-primary" style="flex:1; justify-content:center;">
          Valider la sortie
        </button>
      </div>

      <!-- Zone de resultat (message + montant a payer) -->
      <div id="resultat" style="margin-bottom:12px;"></div>

      <a href="/auth/logout" class="btn btn-secondary"
         style="width: 100%; justify-content: center; margin-top: 8px;">
        Se deconnecter
      </a>

    </div>
  </div>

  <!-- PWA : on active le service worker (cache + hors-ligne). -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>

  <!-- Librairie de scan QR par la camera (chargee depuis internet). -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <script>
    var champCode = document.getElementById("champ-code");
    var resultat = document.getElementById("resultat");
    var boutonEntree = document.getElementById("bouton-entree");
    var boutonSortie = document.getElementById("bouton-sortie");
    var boutonScanner = document.getElementById("bouton-scanner");
    var zoneCamera = document.getElementById("zone-camera");

    // --- Envoyer le code au serveur (entree ou sortie) ---
    function envoyer(action) {
      var code = champCode.value.trim().toUpperCase();
      if (code === "") {
        resultat.innerHTML = "<div class='alert alert-error'>Entrez un code d'abord.</div>";
        return;
      }

      resultat.textContent = "Verification...";
      var url = "/api/gardien/" + action + "?code=" + encodeURIComponent(code);

      fetch(url, { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) {
            resultat.innerHTML = "<div class='alert alert-error'>" + d.message + "</div>";
            return;
          }
          var texte = "<div class='alert alert-success'>" + d.message;
          if (action === "sortie") {
            // On affiche le montant a encaisser en especes.
            texte = texte + "<br><strong>Montant a payer : " + d.montant + "</strong>";
          }
          texte = texte + "</div>";
          resultat.innerHTML = texte;
        })
        .catch(function () {
          resultat.innerHTML = "<div class='alert alert-error'>Erreur reseau. Reessayez.</div>";
        });
    }

    boutonEntree.addEventListener("click", function () { envoyer("entree"); });
    boutonSortie.addEventListener("click", function () { envoyer("sortie"); });

    // --- Scanner le QR avec la camera ---
    boutonScanner.addEventListener("click", function () {
      // Si la librairie n'a pas pu se charger (ex : hors-ligne), on previent.
      if (typeof Html5Qrcode === "undefined") {
        resultat.innerHTML = "<div class='alert alert-error'>" +
          "Scanner indisponible. Tapez le code a la main.</div>";
        return;
      }

      zoneCamera.style.display = "block";
      var scanner = new Html5Qrcode("zone-camera");

      scanner.start(
        { facingMode: "environment" },   // camera arriere du telephone
        { fps: 10, qrbox: 220 },
        function (codeLu) {
          // Quand un QR est lu : on remplit le champ et on arrete la camera.
          champCode.value = codeLu;
          scanner.stop().then(function () {
            zoneCamera.style.display = "none";
          });
          resultat.innerHTML = "<div class='alert alert-success'>Code lu : " + codeLu + "</div>";
        },
        function () { /* on ignore les images sans QR */ }
      ).catch(function () {
        resultat.innerHTML = "<div class='alert alert-error'>" +
          "Impossible d'ouvrir la camera. Tapez le code a la main.</div>";
      });
    });
  </script>

</body>
</html>
