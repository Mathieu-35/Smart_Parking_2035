<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Rendu "app plein ecran" sur iOS (pas de barre de navigateur). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Inscription — Smart Parking 2035</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .auth-logo {
      width: 60px; height: 60px;
      background: #2c5be0;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 22px;
      margin: 0 auto 12px auto;
    }
    .auth-head { text-align: center; margin-bottom: 22px; }
    .auth-head .auth-brand-name { font-size: 15px; }
    .auth-head .auth-title { margin-top: 10px; }
    .auth-head .auth-subtitle { margin-top: 4px; }
    .btn-app { background: #2c5be0; color: #fff; width: 100%; justify-content: center; padding: 11px 12px; }
    .btn-app:hover, .btn-app:active { background: #1e44b0; }

    /* ---- Fond photo aerien + voile bleu (lisibilite) ---- */
    .auth-body {
      background: url('/static/images/login-bg.jpg') center / cover no-repeat fixed;
      position: relative;
    }
    .auth-body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.55), rgba(44, 91, 224, 0.40));
      z-index: 0;
    }
    .auth-wrapper { position: relative; z-index: 1; }

    /* ---- Carte en verre depoli (glassmorphism) ---- */
    .auth-card {
      background: rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }
    .auth-card .form-control { background: rgba(255, 255, 255, 0.85); }
  </style>
</head>
<body class="auth-body">

  <div class="auth-wrapper" style="max-width: 480px;">
    <div class="auth-card">

      <div class="auth-head">
        <div class="auth-logo">SP</div>
        <div class="auth-brand-name">Smart Parking 2035</div>
        <div class="auth-title">Creer votre compte</div>
        <div class="auth-subtitle">
          L'inscription est reservee aux conducteurs.<br/>
          Les comptes gardien et administrateur sont crees par l'administrateur.
        </div>
      </div>

      {% if error %}
      <div class="form-error" style="margin-bottom: 16px;">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/auth/signup">
        <div class="form-grid" style="margin-bottom: 14px;">

          <div class="form-group">
            <label class="form-label" for="prenom">Prenom <span class="required">*</span></label>
            <input class="form-control" type="text" id="prenom" name="prenom"
              placeholder="Jean" required autofocus />
          </div>

          <div class="form-group">
            <label class="form-label" for="nom">Nom <span class="required">*</span></label>
            <input class="form-control" type="text" id="nom" name="nom"
              placeholder="Dupont" required />
          </div>

          <div class="form-group form-grid-full">
            <label class="form-label" for="email">Adresse e-mail <span class="required">*</span></label>
            <input class="form-control" type="email" id="email" name="email"
              placeholder="nom@example.com" required />
          </div>

          <div class="form-group form-grid-full">
            <label class="form-label" for="mot_passe">Mot de passe <span class="required">*</span></label>
            <input class="form-control" type="password" id="mot_passe" name="mot_passe"
              placeholder="••••••••" required />
          </div>

          <div class="form-group form-grid-full">
            <label class="form-label" for="telephone">Telephone</label>
            <input class="form-control" type="tel" id="telephone" name="telephone"
              placeholder="+261 34 00 000 00" />
          </div>

        </div>

        <button type="submit" class="btn btn-app">Creer mon compte</button>

      </form>

      <div class="auth-footer">
        Deja un compte ? <a href="/auth/login">Se connecter</a>
      </div>

    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
