<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Rendu "app plein ecran" sur iOS (pas de barre de navigateur). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Connexion — Smart Parking 2035</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* Logo rond centre en haut (look "app"). */
    .auth-logo {
      width: 60px; height: 60px;
      background: #2c5be0;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 22px;
      margin: 0 auto 12px auto;
    }
    .auth-head { text-align: center; margin-bottom: 22px; }
    .auth-head .auth-brand-name { font-size: 15px; }
    .auth-head .auth-title { margin-top: 10px; }
    /* Bouton bleu de l'app. */
    .btn-app { background: #2c5be0; color: #fff; width: 100%; justify-content: center; padding: 11px 12px; }
    .btn-app:hover, .btn-app:active { background: #1e44b0; }

    /* ---- Fond photo aerien + voile bleu (lisibilite) ---- */
    .auth-body {
      background: url('/static/images/login-bg.jpg') center / cover no-repeat fixed;
      position: relative;
    }
    .auth-body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.55), rgba(44, 91, 224, 0.40));
      z-index: 0;
    }
    .auth-wrapper { position: relative; z-index: 1; }

    /* ---- Carte en verre depoli (glassmorphism) ---- */
    .auth-card {
      background: rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }
    .auth-card .form-control { background: rgba(255, 255, 255, 0.85); }

    /* ---- Ecran de demarrage (splash) sur mobile ---- */
    .splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #2c5be0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    .splash.cache { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: 96px; height: 96px; border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 36px;
      animation: splash-pop 0.6s ease;
    }
    @keyframes splash-pop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="auth-body">

  <!-- Ecran de demarrage : logo SP, UNE fois par ouverture, en contexte mobile -->
  <div class="splash" id="splash">
    <div class="splash-logo">SP</div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById("splash");
      // "app installee" (standalone) ou petit ecran => contexte mobile.
      var estApp = window.matchMedia("(display-mode: standalone)").matches
                   || window.navigator.standalone === true;
      var estMobile = estApp || window.innerWidth <= 700;
      // Pas mobile, ou deja vu cette session : on n'affiche pas le splash.
      if (!estMobile || sessionStorage.getItem("splash_vu")) {
        splash.style.display = "none";
        return;
      }
      sessionStorage.setItem("splash_vu", "1");
      setTimeout(function () { splash.classList.add("cache"); }, 1100);
      setTimeout(function () { splash.style.display = "none"; }, 1600);
    })();
  </script>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-head">
        <div class="auth-logo">SP</div>
        <div class="auth-brand-name">Smart Parking 2035</div>
        <div class="auth-title">Connexion a votre compte</div>
      </div>

      {% if error %}
      <div class="form-error" style="margin-bottom: 16px;">{{ error }}</div>
      {% endif %}

      <form class="auth-form" method="POST" action="/auth/login">

        <div class="form-group">
          <label class="form-label" for="email">Adresse e-mail</label>
          <input class="form-control" type="email" id="email" name="email"
            placeholder="nom@example.com" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="mot_passe">Mot de passe</label>
          <input class="form-control" type="password" id="mot_passe" name="mot_passe"
            placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-app">Se connecter</button>

      </form>

      <div class="auth-footer">
        Pas encore de compte ? <a href="/auth/signup">Creer un compte</a>
      </div>

    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
