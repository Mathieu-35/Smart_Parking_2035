<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Rendu "app plein ecran" sur iOS (pas de barre de navigateur). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Connexion — Smart Parking 2035</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* Logo rond centre en haut (look "app"). */
    .auth-logo {
      width: 60px; height: 60px;
      background: #2c5be0;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 22px;
      margin: 0 auto 12px auto;
    }
    .auth-head { text-align: center; margin-bottom: 22px; }
    .auth-head .auth-brand-name { font-size: 15px; }
    .auth-head .auth-title { margin-top: 10px; }
    /* Bouton bleu de l'app. */
    .btn-app { background: #2c5be0; color: #fff; width: 100%; justify-content: center; padding: 11px 12px; }
    .btn-app:hover, .btn-app:active { background: #1e44b0; }
  </style>
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-head">
        <div class="auth-logo">SP</div>
        <div class="auth-brand-name">Smart Parking 2035</div>
        <div class="auth-title">Connexion a votre compte</div>
      </div>

      {% if error %}
      <div class="form-error" style="margin-bottom: 16px;">{{ error }}</div>
      {% endif %}

      <form class="auth-form" method="POST" action="/auth/login">

        <div class="form-group">
          <label class="form-label" for="email">Adresse e-mail</label>
          <input class="form-control" type="email" id="email" name="email"
            placeholder="nom@example.com" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="mot_passe">Mot de passe</label>
          <input class="form-control" type="password" id="mot_passe" name="mot_passe"
            placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-app">Se connecter</button>

      </form>

      <div class="auth-footer">
        Pas encore de compte ? <a href="/auth/signup">Creer un compte</a>
      </div>

    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
